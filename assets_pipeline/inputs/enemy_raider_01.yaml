name: enemy_raider_01
kind: character
runtime_output_path: apps/client/public/assets/models/characters/enemy_raider_01.glb

generator:
  provider: tripo
  character_model_source: full_body
  tripo:
    mode: multiview
    rig: true
    animation_source: curated
    curated_animation_dir: assets_pipeline/animation_library/enemy_raider_01
    retarget_map_path: assets_pipeline/animation_library/enemy_raider_01/retarget_map.json
    in_place: true
    animation_presets:
      idle_rifle_in_place: idle
      walk_rifle_in_place: walk
      run_rifle_in_place: run
      strafe_left_rifle_in_place: walk
    animations:
      # Rifle locomotion (in-place)
      - idle_rifle_in_place
      - walk_rifle_in_place
      - run_rifle_in_place
      - strafe_left_rifle_in_place

character_qc_enforced: true

# Enemy always has the AK; embed it into the exported enemy GLB as a rigid attachment.
loadout:
  primary_weapon:
    spec: ak47
    embed_in_character_glb: true
    attach:
      socket_bone_name: weapon_socket_r
      bone_semantic: right_hand
      use_weapon_driven_ik: true
      marker_grip_right_name: WPN_GRIP_R
      marker_grip_left_name: WPN_GRIP_L
      marker_sight_name: WPN_SIGHT
      marker_muzzle_name: WPN_MUZZLE
      ads_enabled: true
      ads_clip_names:
        - idle_rifle_in_place
        - walk_rifle_in_place
        - run_rifle_in_place
        - strafe_left_rifle_in_place
      grip_right_offset_m: [-0.034, 0.054, 0.25]
      grip_left_offset_m: [-0.05, 0.63, 0.21]
      sight_offset_m: [-0.10, 0.24, 0.52]
      ads_aim_distance_m: 12.0
      ads_head_bone: Head
      ads_spine_bones: [Spine01, Spine02, R_Clavicle, NeckTwist01, NeckTwist02]
      qc_left_hand_grip_error_cm_max: 2.0
      qc_right_hand_grip_error_cm_max: 2.0
      qc_ads_eye_to_sight_m_max: 0.05
      qc_ads_eye_weapon_alignment_deg_max: 2.0
      qc_ads_sight_alignment_deg_max: 2.0
      qc_ads_wrist_delta_deg_max: 45.0
    muzzle_socket_name: muzzle

description: >
  Fictional hostile raider NPC for a sun-baked bazaar FPS. Competitive-shooter readability:
  believable proportions, clean silhouette, hood + face covering, improvised tactical vest
  with straps/pouches, cargo pants, boots, gloves, small backpack. Neutral A-pose base.
  Enemy uses an AK-style rifle (embedded weapon mesh attached to a right-hand socket),
  and must support: rifle locomotion, crouch, shoot, reload, and death.
  No logos, flags, readable text, or real-world insignia/symbols. Prefer opaque materials
  (no transparency cutouts).

style:
  genre: "realistic-competitive-fps"
  keywords:
    - "competitive shooter"
    - "csgo-like readability"
    - "game-ready"
    - "PBR"
    - "hooded mask"
    - "tactical vest pouches straps"
    - "cargo pants"
    - "boots gloves"
    - "sun-baked bazaar dust"
    - "rifle equipped"
    - "opaque materials"

scale_meters: 1.78

# LOD0-ish target to reduce faceting and improve silhouette.
tri_budget: 25000

# Tripo should provide textures; keep fields for compatibility.
texture:
  generate_basecolor: false
  basecolor_size: 1024

colors:
  primary: "#C2A97A"
  secondary: "#3F4A38"

seed: 1337
